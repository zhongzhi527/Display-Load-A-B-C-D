; Temporary MAC-address printer. Flash to any of the three boards (Load Cell A,
; Load Cell B, or the Display), read the MAC on the Serial Monitor, then flash
; the real firmware back. Not part of the shipped product.

[env:mac_printer]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
