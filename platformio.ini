; Guition JC2432W328C handheld touchscreen display for the wireless dual
; load-cell scale (ESP-NOW).

[platformio]
default_envs = jc2432w328

[env:jc2432w328]
; Pin to the Arduino-ESP32 2.0.x toolchain (platform 6.5.0). The backlight
; code supports both the 2.x and 3.x LEDC APIs, but pinning keeps the build
; reproducible and consistent with the other projects in this system.
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
