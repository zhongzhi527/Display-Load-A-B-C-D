; Single load-cell OLED display controller (ESP-NOW).

[env:esp32dev]
; Pinned to the Arduino-ESP32 2.0.x toolchain (platform 6.5.0) for a known-good
; build. The ESP-NOW receive-callback signature differs on the 3.x core, which
; is handled in code, but pinning keeps the build reproducible.
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@^2.35.30
